version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Keep Next.js and Stellar SDK minor/patch updates in a dedicated group so they stay visible.
      # Major updates are intentionally excluded so they open as separate, ungrouped PRs.
      nextjs-and-stellar:
        patterns:
          - "next"
          - "@next/bundle-analyzer"
          - "eslint-config-next"
          - "@stellar/stellar-sdk"
          - "@stellar/freighter-api"
        update-types:
          - "minor"
          - "patch"
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
